[tool.poetry]
name = "proyectos"
version = "1.0.0"
description = ""
authors = ["Juan Bastidas <juanbastidas931@hotmal.com>"]
packages = [
    { include = "app", from = "." }
]
[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.11"
uvicorn = "^0.34.0"
SQLAlchemy = "^2.0.39"
PyMySQL = "^1.1.1"
python-dotenv = "^1.0.1"
alembic = "^1.15.1"
sqlacodegen = "^3.0.0"
pandas = "^2.2.3"
scikit-learn = "^1.6.1"
numpy = "^2.2.4"
pydantic = {extras = ["email"], version = "^2.11.1"}
cryptography = "^44.0.2"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pydantic-settings = "^2.14.0"
slowapi = "^0.1.9"
joblib = "^1.4.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
requests = "^2.33.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "app.main:start"
