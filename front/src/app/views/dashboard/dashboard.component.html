<c-card class="my-1 w-100">
  <c-card-body>
    <h4 class="text-center">Filtros</h4>
    <form cForm [formGroup]="form" (ngSubmit)="onSubmit()">
      <c-row class="mb-3">
        <c-col>
          <label cLabel for="anioInicio">Año de Inicio</label>
          <select
            cSelect
            id="anioInicio"
            aria-label="Default select example"
            class="w-100"
            [formControlName]="'anioInicio'"
          >
            <option value="2020">2020</option>
            <option value="2021">2021</option>
            <option value="2022">2022</option>
            <option value="2023">2023</option>
            <option value="2024">2024</option>
          </select>
        </c-col>
        <c-col>
          <label cLabel for="anioFin">Año Fin</label>
          <select
            cSelect
            id="anioFin"
            aria-label="Default select example"
            class="w-100"
            [formControlName]="'anioFin'"
          >
            <option value="2020">2020</option>
            <option value="2021">2021</option>
            <option value="2022">2022</option>
            <option value="2023">2023</option>
            <option value="2024">2024</option>
          </select>
        </c-col>
        <c-col>
          <label clabel for="municipio">Municipio</label>
          <select
            cSelect
            id="municipio"
            aria-label="Default select example"
            class="w-100"
            [formControlName]="'municipio'"
          >
            @for (municipio of municipios; track municipio.Codigo) {
            {{
              municipio
            }}
            <option [value]="municipio.Codigo">{{ municipio.Nombre }}</option>
            }
          </select>
        </c-col>
      </c-row>
      <c-row class="mb-1 p-2">
        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <button cButton color="primary" class="me-md-2" type="submit">
            Filtrar
          </button>
          <button
            cButton
            color="primary"
            variant="outline"
            (click)="ngOnInit()"
          >
            Reiniciar
          </button>
        </div>
      </c-row>
    </form>
  </c-card-body>
</c-card>

<c-row>
  <c-col class="col-12">
    <c-card class="my-1 w-100">
      <c-card-body>
        <table cTable class="table table-striped table-bordered">
          <thead class="table-primary text-center">
            <tr class="table-primary text-center" cTableColor="success">
              <th colspan="2">Municipio</th>
              <th colSpan="5">IRCA por año</th>
            </tr>
          </thead>
          <tbody>
            @for (municipio of paginatedData; track municipio) { @if ($first) {
            <tr class="table-primary text-end" cTableColor="success">
              <td colspan="2"></td>
              @for (anio of anios; track anio) {
              <td>{{ anio }}</td>
              }
            </tr>
            }
            <tr>
              <td [style.background-color]="municipio.color"> </td>
              <td class="py-3">
                {{ municipio.municipio }}
              </td>
              @for (anio of anios; track anio) { @if (municipio[anio]) {
              <td class="text-end">{{ municipio[anio] }}</td>
              } }
            </tr>
            }
          </tbody>
        </table>
      </c-card-body>
      <c-card-footer class="text-medium-emphasis">
        <nav
          aria-label="Paginación"
          class="d-flex justify-content-center mt-3 p-2"
        >
          <ul class="pagination">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <button class="page-link" (click)="changePage(currentPage - 1)">
                Anterior
              </button>
            </li>
            <li
              class="page-item"
              *ngFor="
                let page of [].constructor(
                  Math.ceil(datasource.length / itemsPerPage)
                );
                let i = index
              "
              [class.active]="i + 1 === currentPage"
            >
              <button class="page-link" (click)="changePage(i + 1)">
                {{ i + 1 }}
              </button>
            </li>
            <li
              class="page-item"
              [class.disabled]="
                currentPage === Math.ceil(datasource.length / itemsPerPage)
              "
            >
              <button class="page-link" (click)="changePage(currentPage + 1)">
                Siguiente
              </button>
            </li>
          </ul>
        </nav>
      </c-card-footer>
    </c-card>
  </c-col>
</c-row>
<c-row>
  <c-col class="col-6">
    <c-card class="my-1 w-100">
      <c-card-body>
        <c-chart
          [data]="chartData"
          [height]="500"
          [ngStyle]="{ 'marginTop.px': 10 }"
          [options]="chartOptions"
          [type]="chartType"
        >
          Main chart
        </c-chart>
      </c-card-body>
    </c-card>
  </c-col>
  <c-col class="col-6">
    <c-card class="my-1 w-100">
      <c-card-body>
        <div id="map" style="height: 500px"></div>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
